<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 400" width="520" height="400" role="img" aria-label="Une voiture partagée roule vers le campus">
  <!-- Illustration de l'accueil CoVoie, dessinée à la main en SVG (formes simples) -->

  <!-- Fond : grand disque vert pâle + soleil -->
  <circle cx="275" cy="200" r="185" fill="#d3eee5"/>
  <circle cx="430" cy="78" r="30" fill="#f2c94c"/>

  <!-- Trajet en pointillés entre le point de départ et le campus -->
  <path d="M78 228 C 120 120, 250 70, 352 128" fill="none" stroke="#0f7a63" stroke-width="3" stroke-dasharray="2 9" stroke-linecap="round"/>
  <!-- Point de départ (rond vide) -->
  <circle cx="78" cy="228" r="9" fill="#fff" stroke="#0f7a63" stroke-width="4"/>
  <!-- Point d'arrivée (épingle) -->
  <path d="M352 96c-13 0-22 9.5-22 21.5 0 16 22 34.5 22 34.5s22-18.5 22-34.5c0-12-9-21.5-22-21.5z" fill="#0f7a63"/>
  <circle cx="352" cy="117" r="7.5" fill="#fff"/>

  <!-- Arbres -->
  <g>
    <rect x="148" y="232" width="6" height="40" rx="3" fill="#0b5a49"/>
    <circle cx="151" cy="222" r="24" fill="#0f7a63"/>
    <rect x="186" y="246" width="5" height="28" rx="2.5" fill="#0b5a49"/>
    <circle cx="188.5" cy="240" r="16" fill="#3aa486"/>
    <rect x="470" y="236" width="6" height="36" rx="3" fill="#0b5a49"/>
    <circle cx="473" cy="226" r="21" fill="#3aa486"/>
  </g>

  <!-- Bâtiment du campus -->
  <g>
    <rect x="262" y="160" width="190" height="114" rx="6" fill="#fff"/>
    <rect x="262" y="160" width="190" height="26" rx="6" fill="#0b5a49"/>
    <rect x="262" y="176" width="190" height="10" fill="#0b5a49"/>
    <text x="357" y="178" text-anchor="middle" font-family="Roboto, Arial, sans-serif" font-size="13" font-weight="700" letter-spacing="3" fill="#fff">CAMPUS</text>
    <!-- Fenêtres -->
    <g fill="#d3eee5">
      <rect x="278" y="198" width="26" height="18" rx="3"/>
      <rect x="314" y="198" width="26" height="18" rx="3"/>
      <rect x="374" y="198" width="26" height="18" rx="3"/>
      <rect x="410" y="198" width="26" height="18" rx="3"/>
      <rect x="278" y="226" width="26" height="18" rx="3"/>
      <rect x="314" y="226" width="26" height="18" rx="3"/>
      <rect x="374" y="226" width="26" height="18" rx="3"/>
      <rect x="410" y="226" width="26" height="18" rx="3"/>
    </g>
    <!-- Porte -->
    <rect x="344" y="226" width="26" height="48" rx="4" fill="#0f7a63"/>
    <circle cx="364" cy="252" r="2" fill="#f2c94c"/>
  </g>

  <!-- Route -->
  <rect x="20" y="272" width="490" height="62" rx="31" fill="#10261f"/>
  <path d="M60 303 H470" stroke="#f2c94c" stroke-width="4" stroke-dasharray="22 18" stroke-linecap="round"/>

  <!-- Voiture partagée (vue de côté) avec deux passagers -->
  <g transform="translate(104 222)">
    <!-- Ombre -->
    <ellipse cx="80" cy="84" rx="78" ry="6" fill="#000" opacity=".18"/>
    <!-- Habitacle -->
    <path d="M40 30 L62 8 C66 4 70 2 76 2 H108 C114 2 119 5 123 10 L140 30 Z" fill="#0f7a63"/>
    <!-- Vitres -->
    <path d="M52 30 L68 13 C70 11 73 10 76 10 H88 V30 Z" fill="#d3eee5"/>
    <path d="M96 10 H108 C111 10 114 12 116 15 L127 30 H96 Z" fill="#d3eee5"/>
    <!-- Passagers -->
    <circle cx="76" cy="19" r="5" fill="#10261f"/>
    <path d="M67 30 C67 25 71 23.5 76 23.5 C81 23.5 85 25 85 30 Z" fill="#10261f"/>
    <circle cx="108" cy="19" r="5" fill="#10261f"/>
    <path d="M99 30 C99 25 103 23.5 108 23.5 C113 23.5 117 25 117 30 Z" fill="#10261f"/>
    <!-- Carrosserie -->
    <path d="M10 30 H150 C158 30 164 36 164 44 V60 C164 64 161 67 157 67 H7 C3 67 0 64 0 60 V40 C0 34 4 30 10 30 Z" fill="#14a37f"/>
    <rect x="0" y="46" width="164" height="5" fill="#0f7a63"/>
    <!-- Phare et feu arrière -->
    <rect x="152" y="36" width="12" height="7" rx="3.5" fill="#f2c94c"/>
    <rect x="0" y="36" width="8" height="7" rx="3.5" fill="#e35d4f"/>
    <!-- Poignées -->
    <rect x="72" y="37" width="12" height="3" rx="1.5" fill="#0f7a63"/>
    <rect x="104" y="37" width="12" height="3" rx="1.5" fill="#0f7a63"/>
    <!-- Roues -->
    <circle cx="36" cy="67" r="15" fill="#10261f"/>
    <circle cx="36" cy="67" r="6" fill="#d3eee5"/>
    <circle cx="128" cy="67" r="15" fill="#10261f"/>
    <circle cx="128" cy="67" r="6" fill="#d3eee5"/>
  </g>

  <!-- Petit billet flottant (rappel du design des cartes) -->
  <g transform="translate(22 92) rotate(-6)">
    <rect width="120" height="64" rx="12" fill="#fff"/>
    <path d="M84 8 V56" stroke="#dcebe5" stroke-width="2" stroke-dasharray="4 4"/>
    <rect x="14" y="16" width="52" height="7" rx="3.5" fill="#10261f"/>
    <rect x="14" y="30" width="38" height="6" rx="3" fill="#dcebe5"/>
    <rect x="14" y="43" width="44" height="6" rx="3" fill="#dcebe5"/>
    <rect x="91" y="22" width="24" height="20" rx="5" fill="#f2c94c"/>
  </g>
</svg>
