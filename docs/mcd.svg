family='Roboto, Arial, sans-serif' font-size='13.5' font-weight='400' fill='#10261f' text-anchor='start' >• Une seule demande par passager et par trajet.</text><text x='1020' y='830' font-family='Roboto, Arial, sans-serif' font-size='13.5' font-weight='400' fill='#10261f' text-anchor='start' >• Une seule note par trajet, auteur et personne notée.</text><text x='1020' y='855' font-family='Roboto, Arial, sans-serif' font-size='13.5' font-weight='400' fill='#10261f' text-anchor='start' >• La note moyenne n&#x27;est pas stockée : AVG(note).</text></svg>